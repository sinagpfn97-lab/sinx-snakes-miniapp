name: Deploy SINX to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Generate glass card WebP assets
        run: node scripts/generate-hokm-cards.mjs
      - name: Stamp build version into app assets
        run: |
          APP_VERSION="$(cat VERSION)"
          BUILD_VERSION="${GITHUB_SHA::12}"
          find . -type f -name '*.html' -not -path './.git/*' -exec sed -i -e "s/__APP_VERSION__/${APP_VERSION}/g" -e "s/__BUILD_VERSION__/${BUILD_VERSION}/g" {} +
          printf '{"version":"%s","build":"%s","minimumSupportedVersion":"%s"}\n' "$APP_VERSION" "$BUILD_VERSION" "$APP_VERSION" > version.json
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
